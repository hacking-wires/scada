name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Syntax check
        run: |
          python -m py_compile server.py
          python -m py_compile simulator.py
      - name: Tests
        run: python -m pytest tests/ -q
