name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile server.py
          python -m py_compile simulator.py
      - name: Boot smoke test
        run: |
          python -c "import server; c = server.app.test_client(); r = c.get('/status'); assert r.status_code == 200, r.status_code"
