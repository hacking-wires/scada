name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile server.py simulator.py
          python -m py_compile attacks/spoof.py attacks/dos.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
